<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Especial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h2 id="video-title">Vídeo Especial 1.mp4</h2>
        
        <div class="video-container">
            <video id="main-video" controls width="100%" preload="metadata">
                Seu navegador não suporta reprodução de vídeos.
            </video>
        </div>

        <div class="controls">
            <button id="btn-back">Back</button>
            <button id="btn-pause">Pause</button>
            <button id="btn-play">Play</button>
            <button id="btn-next">Next</button>
            <button id="btn-close" class="btn-close">Close</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
